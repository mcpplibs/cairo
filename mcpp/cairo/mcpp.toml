include_dirs = [
    "../../upstream/src",
    "../../upstream/util",
    "include",
]

cflags = [
    "-DHAVE_CONFIG_H",
    # Upstream passes this to every TU of the library (src/meson.build:245).
    # It is not a niceness: cairo uses it to decide symbol visibility and which
    # internal implementations get wired up. Without it the library still
    # builds and links, `cairo_paint` still works — and `cairo_stroke` changes
    # zero pixels with cairo_status reporting SUCCESS. Measured.
    "-DCAIRO_COMPILATION",
    "-D_GNU_SOURCE",
    "-fPIC",
]

ldflags = ["-lm"]

# pixman is the software rasterizer cairo draws through; it is not optional and
# is not a feature.
[dependencies]
compat.pixman = "0.46.4"

[lib]
path = "src/cairo.cppm"

[targets.cairo]
kind = "lib"

# ── features ─────────────────────────────────────────────────────────────
[features]
# The Wayland-first default set. `ft` and `fc` because a cairo that cannot draw
# text is not useful on Linux; `png` because it is what every screenshot and
# thumbnail path takes and it costs one source file.
#
# `xlib` and `xcb` are NOT here, deliberately — that is the whole point of the
# split. Someone drawing a circle in a Wayland program should not acquire
# libX11 to do it.
#
# Turn the defaults off with `default-features = false` and name what you want.
default = ["ft", "fc", "png"]

# FreeType glyph rendering. On by default: it is the only font backend that
# works outside macOS and Windows, so a Linux consumer that turned it off would
# have a cairo that cannot draw text.
[features.ft]
defines  = ["CAIRO_HAS_FT_FONT"]
sources  = [
    "../../upstream/src/cairo-ft-font.c",
    "../../upstream/src/cairo-colr-glyph-render.c",
    "../../upstream/src/cairo-svg-glyph-render.c",
]
# Font DISCOVERY, as opposed to rendering: `cairo_ft_font_face_create_for_pattern`
# takes an FcPattern. Separate from `ft` because a program that already has a
# font file needs the renderer and not the matcher.
[features.fc]
defines  = ["CAIRO_HAS_FC_FONT"]
# PNG surfaces. Small, and the path every screenshot and thumbnail takes.
[features.png]
defines  = ["CAIRO_HAS_PNG_FUNCTIONS"]
sources  = [
    "../../upstream/src/cairo-png.c",
]
# Vector output. Off by default — a program that draws on screen never touches
# them, and each pulls its own compression path in.
[features.pdf]
defines  = ["CAIRO_HAS_PDF_SURFACE"]
sources  = [
    "../../upstream/src/cairo-pdf-surface.c",
    "../../upstream/src/cairo-pdf-interchange.c",
]
[features.ps]
defines  = ["CAIRO_HAS_PS_SURFACE"]
sources  = [
    "../../upstream/src/cairo-ps-surface.c",
]
[features.svg]
defines  = ["CAIRO_HAS_SVG_SURFACE"]
sources  = [
    "../../upstream/src/cairo-svg-surface.c",
]

# Debugging surfaces. `script` records a drawing as a replayable trace and `tee`
# fans one drawing out to several surfaces; both are how a rendering bug gets
# reported. No external dependency, so they cost nothing but code size.
[features.script]
defines  = ["CAIRO_HAS_SCRIPT_SURFACE"]
sources  = [
    "../../upstream/src/cairo-script-surface.c",
]

[features.tee]
defines  = ["CAIRO_HAS_TEE_SURFACE"]
sources  = [
    "../../upstream/src/cairo-tee-surface.c",
]

# ── X11, OFF BY DEFAULT ───────────────────────────────────────────────────
#
# The whole point of the feature split. Ten source files and libX11/libXext
# each, for a backend a Wayland program never calls.

[features.xlib]
defines  = ["CAIRO_HAS_XLIB_SURFACE", "CAIRO_HAS_XLIB_XRENDER_SURFACE"]
sources  = [
    "../../upstream/src/cairo-xlib-display.c",
    "../../upstream/src/cairo-xlib-core-compositor.c",
    "../../upstream/src/cairo-xlib-fallback-compositor.c",
    "../../upstream/src/cairo-xlib-render-compositor.c",
    "../../upstream/src/cairo-xlib-screen.c",
    "../../upstream/src/cairo-xlib-source.c",
    "../../upstream/src/cairo-xlib-surface.c",
    "../../upstream/src/cairo-xlib-surface-shm.c",
    "../../upstream/src/cairo-xlib-visual.c",
    "../../upstream/src/cairo-xlib-xcb-surface.c",
]
[features.xcb]
defines  = ["CAIRO_HAS_XCB_SURFACE", "CAIRO_HAS_XCB_SHM_FUNCTIONS"]
sources  = [
    "../../upstream/src/cairo-xcb-connection.c",
    "../../upstream/src/cairo-xcb-connection-core.c",
    "../../upstream/src/cairo-xcb-connection-render.c",
    "../../upstream/src/cairo-xcb-connection-shm.c",
    "../../upstream/src/cairo-xcb-screen.c",
    "../../upstream/src/cairo-xcb-shm.c",
    "../../upstream/src/cairo-xcb-surface.c",
    "../../upstream/src/cairo-xcb-surface-core.c",
    "../../upstream/src/cairo-xcb-surface-render.c",
    "../../upstream/src/cairo-xcb-resources.c",
]

[feature-deps.ft]
compat.freetype = "2.13.3"

[feature-deps.fc]
freedesktop.fontconfig = "2.15.0"

[feature-deps.png]
compat.libpng = "1.6.43"
compat.zlib = "1.3.2"

[feature-deps.pdf]
compat.zlib = "1.3.2"

[feature-deps.ps]
compat.zlib = "1.3.2"

[feature-deps.xlib]
compat.x11 = "1.8.13"
compat.xext = "1.3.7"

[feature-deps.xcb]
compat.xcb = "1.17.0"
