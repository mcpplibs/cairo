# freedesktop.cairo — 2D vector drawing.
#
# The layer a panel, a launcher or any widget toolkit draws through: paths,
# strokes, fills, text runs, and surfaces to put them on. `pango` lays text out
# and cairo renders it; a compositor that only composites does not need it, a
# desktop SHELL does.
#
# ─────────────────────────────────────────────────────────────────────────
# WHY THIS IS EASIER THAN ITS SIZE SUGGESTS
#
# 104k lines of C, and no code generation at all: upstream's meson emits exactly
# two artifacts, `config.h` and `cairo-features.h`, and both are
# `configure_file` — probe answers, not generated code. There is no python, no
# gperf and no custom_target anywhere in the build.
#
# So the fork carries no `build.mcpp`: the two headers are hand-written in
# `include/`, where a reader can see and argue with every value. Package
# difficulty is decided by GENERATORS, not by line count — fontconfig is a
# quarter the size and needed seven.
#
# ─────────────────────────────────────────────────────────────────────────
# THE BACKENDS ARE FEATURES, AND THE DEFAULT SET IS WAYLAND-FIRST
#
# Upstream makes each backend a `get_option()`, which means a distribution
# decides once for everyone. An index cannot do that: a Wayland compositor and
# an X11 application want different cairos out of the same package.
#
# `xlib` and `xcb` are therefore OFF by default. Someone drawing a circle in a
# Wayland program should not acquire libX11 to do it; someone who wants X11
# writes `cairo = { features = ["xlib"] }` and says so in their manifest.
#
# SOURCES ARE LISTED FILE BY FILE, NEVER AS A GLOB. Feature source selection
# matches literal entries, so a glob inside a feature block is not filtered by
# the feature — `"*/src/cairo-xlib-*.c"` would compile the X11 backend into
# every consumer whether they asked for it or not. The lists below are
# upstream's own `cairo_feature_sources` dictionary (src/meson.build:127),
# transcribed entry for entry.
[package]
namespace   = "freedesktop"
name        = "cairo"
version     = "1.18.2"
standard    = "c++23"
description = "cairo 1.18.2 — 2D vector drawing, with each backend as a feature and X11 off by default"
license     = "LGPL-2.1-or-later OR MPL-1.1"
repo        = "https://github.com/mcpplibs/cairo"

[build]
# The always-on core: paths, surfaces, the software rasterizer, the image and
# recording surfaces. `cairo_sources` in upstream's src/meson.build.
sources = [
